/* the matching: a term matches inside a text as a whole word; a text already carrying an (i) is skipped; the title of a card gets at most one extra (i) */
(function () {
  var rx = null;
  M.termFor = function (text) {
    var t = String(text || '').toLowerCase().replace(/[▲▼]/g, '').replace(/\s+/g, ' ').trim();
    if (!t || t.length > 80) return null;
    for (var i = 0; i < M.TERMS.length; i++) {
      var w = M.TERMS[i][0];
      var at = t.indexOf(w);
      if (at < 0) continue;
      var before = at === 0 ? ' ' : t.charAt(at - 1), after = at + w.length >= t.length ? ' ' : t.charAt(at + w.length);
      if (/[a-z0-9]/.test(before) || /[a-z0-9]/.test(after)) continue;
      return { word: w, text: M.TERMS[i][1] };
    }
    return null;
  };
  var addTo = function (el, anchorSel) {
    if (!el || el.querySelector('.info-mark') || el.getAttribute('data-term')) return;
    var raw = (el.getAttribute('data-term-text') || el.textContent), hit = M.termFor(raw);
    if (!hit) return;
    el.setAttribute('data-term', hit.word);
    var tgt = anchorSel ? el.querySelector(anchorSel) || el : el;
    tgt.appendChild(document.createTextNode(' '));
    tgt.appendChild(M.infoMark(hit.text, hit.word.charAt(0).toUpperCase() + hit.word.slice(1), 'term-mark'));
  };
  /* sort headings are buttons: the mark goes after the button so a click on the mark never sorts */
  M.explainTerms = function () {
    var main = document.getElementById('main');
    if (!main) return;
    Array.prototype.forEach.call(main.querySelectorAll('th'), function (th) {
      if (th.querySelector('.info-mark')) return;
      var b = th.querySelector('button'), label = (b || th).textContent;
      var hit = M.termFor(label);
      if (!hit) return;
      th.appendChild(M.infoMark(hit.text, hit.word.charAt(0).toUpperCase() + hit.word.slice(1), 'term-mark'));
    });
    Array.prototype.forEach.call(main.querySelectorAll('.kpi .l'), function (l) { addTo(l); });
    Array.prototype.forEach.call(main.querySelectorAll('.card > h3 .h3t, .fs-head h2 > span'), function (h) {
      var h3 = h.parentNode;
      if (h3.querySelector('.info-mark')) return;       /* a card that already explains itself keeps its own (i) */
      var hit = M.termFor(h.textContent);
      if (!hit) return;
      h.appendChild(document.createTextNode(' '));
      h.appendChild(M.infoMark(hit.text, hit.word.charAt(0).toUpperCase() + hit.word.slice(1), 'term-mark'));
    });
    Array.prototype.forEach.call(main.querySelectorAll('.tag'), function (s) { addTo(s); });
    Array.prototype.forEach.call(main.querySelectorAll('.seg button'), function (b) { /* a button label keeps its own click: a title is enough */
      var hit = M.termFor(b.textContent); if (hit && !b.title) b.title = hit.text;
    });
  };
  var base = M.afterRender;
  M.afterRender = function () { if (base) base(); try { M.explainTerms(); } catch (e) { console.error(e); } };
  var rf = M.render;
  M.render = function () { rf(); try { M.explainTerms(); } catch (e) { console.error(e); } };
})();

   The real <select> stays in the page (hidden, 1px) and is the one source of truth: choosing a line sets it and fires its normal 'change' event, so no other code had to change.
   On a phone or tablet (a touch screen) nothing is replaced: the system picker is better there. Everything added carries data-ux="1". */

  var closeList = function (focusBtn) {

  var refresh = function (sel) {

  var place = function (o) {

    l.style.minWidth = Math.max(r.width, 200) + 'px';
    l.style.maxHeight = '';
    var h = l.offsetHeight, below = window.innerHeight - r.bottom - 12, above = r.top - 12;
    var up = h > below && above > below;
    var maxH = Math.max(160, Math.min(360, up ? above : below));

    h = Math.min(h, maxH);
    var left = Math.max(8, Math.min(r.left, window.innerWidth - l.offsetWidth - 8));
    l.style.left = Math.round(left) + 'px';

  var openList = function (sel) {

    if (M.popClose && !btn.closest('.tpop')) M.popClose();

    var list = M.h('div', { class: 'dd-list', role: 'listbox', id: id, 'data-ux': '1', 'aria-label': (sel.getAttribute('aria-label') || (sel.id && document.querySelector('label[for="' + sel.id + '"]') ? document.querySelector('label[for="' + sel.id + '"]').textContent : 'Choose')) });
    var filter = null;
    if (opts.length > 12) {
      filter = M.h('input', { type: 'text', class: 'dd-filter', placeholder: 'Type to filter', 'aria-label': 'Filter the list', autocomplete: 'off' });
      list.appendChild(M.h('div', { class: 'dd-filter-wrap' }, [filter]));
    }
    var body = M.h('div', { class: 'dd-body' });
    list.appendChild(body);
    var items = [];
    opts.forEach(function (op, i) {
      var li = M.h('div', { class: 'dd-item' + (op.selected ? ' on' : ''), role: 'option', id: id + '-' + i, 'aria-selected': op.selected ? 'true' : 'false', 'data-i': String(i) }, [M.h('span', { class: 'dd-text', text: op.text }), tick()]);

    });

    body.appendChild(empty);
    document.body.appendChild(list);
    open = { sel: sel, btn: btn, list: list, items: items, cur: Math.max(0, sel.selectedIndex), filter: filter };
    M._ddOpen = true;
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-controls', id);
    place(open);
    var vis = function () { return items.filter(function (x) { return !x.el.hidden && !x.el.classList.contains('off'); }); };

      var v = vis(); if (!v.length) return;

    };

      var changed = sel.selectedIndex !== i;

    };
    open.choose = choose; open.mark = mark; open.vis = vis;
    list.addEventListener('mousedown', function (e) { if (e.target !== filter) e.preventDefault(); });
    list.addEventListener('click', function (e) { e.stopPropagation(); var it = e.target.closest('.dd-item'); if (it && !it.classList.contains('off')) choose(+it.getAttribute('data-i')); });
    list.addEventListener('mousemove', function (e) { var it = e.target.closest('.dd-item'); if (!it || it.classList.contains('off')) return; var v = vis(), k = v.findIndex(function (x) { return x.el === it; }); if (k >= 0 && k !== open.hot) { items.forEach(function (x) { x.el.classList.remove('hot'); }); it.classList.add('hot'); open.cur = +it.getAttribute('data-i'); open.hot = k; } });
    if (filter) {
      filter.addEventListener('input', function () {
        var q = filter.value.toLowerCase().trim(), n = 0;
        items.forEach(function (x) { var show = !q || x.text.indexOf(q) >= 0; x.el.hidden = !show; if (show) n++; });
        empty.hidden = n > 0; place(open); mark(0);

      filter.addEventListener('keydown', function (e) { keyHandler(e); });

    }
    var k0 = vis().findIndex(function (x) { return x.i === sel.selectedIndex; });
    mark(k0 < 0 ? 0 : k0);
    var cur = list.querySelector('.dd-item.hot'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  };

  var typed = '', typedAt = 0;
  var keyHandler = function (e) {
    if (!open) return;

    if (k === 'ArrowUp') { e.preventDefault(); open.mark((open.hot || 0) - 1); return; }
    if (k === 'Home') { e.preventDefault(); open.mark(0); return; }
    if (k === 'End') { e.preventDefault(); open.mark(1e6); return; }

    if (touch()) return;
    Array.prototype.forEach.call((root || document).querySelectorAll('select'), function (sel) {

      var btn = M.h('button', { type: 'button', class: 'dd-btn', 'aria-haspopup': 'listbox', 'aria-expanded': 'false', 'data-ux': '1' }, [M.h('span', { class: 'dd-label' }), chev()]);

      });

      refresh(sel);
    });
  };

    Array.prototype.forEach.call(document.querySelectorAll('select.dd-native'), function (sel) { refresh(sel); if (sel._dd) { sel._dd.title = sel.title || ''; } });
  };

  /* Safari does not focus a button when it is clicked, so after a mouse click the keys go to the page: while a list is open, the keys are taken here whatever has the focus */
  document.addEventListener('keydown', function (e) {

    var t = e.target;
    if (t === open.btn || (open.filter && t === open.filter)) return;      /* those two have their own handler */

  M.overlayOpen = function () { return !!M._ddOpen || (ov ? ov() : false); };

  var rf = M.render;
  M.render = function () { closeList(false); rf(); M.enhanceSelects(document); M.syncDropdowns(); };

  if (fo) M.fsOpen = function () { var r = fo.apply(this, arguments); M.enhanceSelects(document.getElementById('fsroot')); M.syncDropdowns(); return r; };
})();

/* mazo dashboard, hosted mode (T807, 1 Nov 2026): the unlock screen and the loader that fetches data by month. Only runs when the page was built for the web (window.MAZO_HOSTED);
   the one file build (docs/reports/dashboard/mazo-dashboard.html) never uses any of this. Plan and design: docs/guides/robust-data-and-hosting-plan.md, scripts/site_crypto.py.

   How data reaches a page: the small "core" file (state tables, totals, the table list, the filter lists, which month files exist) is opened once after the passphrase. Before every
   draw, M.needFor() works out which month files the page needs (the chosen dates, the period before them for compare, the last two months, and the night pictures a page asks for),
   M.ensure() fetches and opens only the missing ones, merges their rows into the tables, and then the normal synchronous draw runs. Nothing else in the dashboard knows about this. */

M.lazy = { enc: null, mac: null, done: {}, inflight: {}, parts: {}, base: {}, token: 0 };

/* ------------------------------------------------------------ fetching and merging */
M.lazyFetch = function (logical) {
  return MZ.nameOf(M.lazy.mac, logical).then(function (name) {
    return fetch('f/' + name, { credentials: 'omit', cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(logical + ' answered ' + r.status);
      return r.arrayBuffer();
    });
  }).then(function (buf) { return MZ.open(M.lazy.enc, logical, buf); });
};
/* put the rows of one opened month file into the tables; a table is always rebuilt as its own undated rows + the months in date order, so the order never depends on which month arrived first */
M.lazyMerge = function (logical, obj) {
  var L = M.lazy, tabs = M.D.tabs;
  Object.keys(obj.t || {}).forEach(function (t) {
    if (!tabs[t]) tabs[t] = { c: [], r: [] };
    var p = L.parts[t] || (L.parts[t] = { months: {} });
    p.months[logical] = obj.t[t];
    var rows = (L.base[t] || []).slice();
    Object.keys(p.months).sort().forEach(function (k) { rows = rows.concat(p.months[k]); });
    tabs[t].r = rows;
  });
};
M.ensure = function (ids) {
  var L = M.lazy, todo = ids.filter(function (id) { return !L.done[id]; });
  return Promise.all(todo.map(function (id) {
    if (!L.inflight[id]) L.inflight[id] = M.lazyFetch(id).then(function (obj) { M.lazyMerge(id, obj); L.done[id] = true; delete L.inflight[id]; }, function (e) { delete L.inflight[id]; throw e; });
    return L.inflight[id];
  })).then(function () { if (todo.length) M.dropCaches(); });
};

/* ------------------------------------------------------------ which files does this page need? */
M.monthsBetween = function (from, to) {
  var out = [], y = +from.slice(0, 4), m = +from.slice(5, 7), ty = +to.slice(0, 4), tm = +to.slice(5, 7);
  while ((y < ty || (y === ty && m <= tm)) && out.length < 1500) { out.push(y + '-' + (m < 10 ? '0' : '') + m); if (++m > 12) { m = 1; y++; } }
  return out;
};
M.needFor = function () {
  var F = M.D.files || { d: [], p: [], h: {} }, s = M.state, r = M.range(), want = [], has = function (list, m) { return list && list.indexOf(m) >= 0; };
  var from = r.pfrom && r.pfrom < r.from ? r.pfrom : r.from;               /* the period before is always loaded: compare, and the compare tool of any single chart, use it */
  var an = M.D.anchor || r.to;
  M.monthsBetween(from, r.to).concat(M.monthsBetween(M.add(an.slice(0, 8) + '01', -1), an)).forEach(function (m) { if (has(F.d, m)) want.push('d-' + m); });
  var wide = M.monthsBetween(from, M.add(r.to, 7));
  if (s.page === 'history') {
    var src = s.hsrc;
    if (/_hist$/.test(src)) wide.forEach(function (m) { if (has(F.h[src], m)) want.push('h-' + src + '-' + m); });
    if (src === 'threads_posts_daily' || src === 'youtube_videos_daily') wide.forEach(function (m) { if (has(F.p, m)) want.push('p-' + m); });
  }
  if (s.page === 'functions') (F.h.function_summary_hist || []).forEach(function (m) { want.push('h-function_summary_hist-' + m); });
  if (s.snap) {
    var sm = s.snap.slice(0, 7), pm = M.add(sm + '-01', -1).slice(0, 7);
    Object.keys(F.h).forEach(function (t) { [pm, sm].forEach(function (m) { if (has(F.h[t], m)) want.push('h-' + t + '-' + m); }); });
  }
  return want.filter(function (id, i) { return want.indexOf(id) === i; });
};

/* ------------------------------------------------------------ the draw waits for the files (and draws at once when it has them) */
M.loadBar = function (on) {
  var b = document.getElementById('lazybar');
  if (!b) { b = M.h('div', { id: 'lazybar', role: 'status', 'aria-live': 'polite', hidden: true, text: 'Loading the dates you picked...' }); document.body.appendChild(b); }
  b.hidden = !on;
  var m = document.getElementById('main'); if (m) m.setAttribute('aria-busy', on ? 'true' : 'false');
};
(function () {
  var base = M.render;
  M.render = function () {
    if (!M.D.lazy || !M.lazy.enc) return base();
    var my = ++M.lazy.token, need;
    try { need = M.needFor(); } catch (e) { console.error(e); return base(); }
    if (need.every(function (id) { return M.lazy.done[id]; })) { M.loadBar(false); return base(); }
    M.loadBar(true);
    M.ensure(need).then(function () { if (my === M.lazy.token) { M.loadBar(false); base(); } }, function (err) {
      if (my !== M.lazy.token) return;
      M.loadBar(false);
      console.error(err);
      var main = document.getElementById('main'); M.clear(main);
      main.appendChild(M.empty('Some data could not be loaded (' + (err && err.message ? err.message : 'error') + '). Check the connection.', ''));
      main.appendChild(M.h('button', { type: 'button', class: 'btn', text: 'Try again', onclick: function () { M.render(); } }));
    });
  };
})();

/* ------------------------------------------------------------ keys kept on this device: two browser keys that cannot be exported, in IndexedDB (never the passphrase, never the data key) */
M.keyStore = function (mode, val) {
  return new Promise(function (resolve, reject) {
    var q = indexedDB.open('mazo-board', 1);
    q.onupgradeneeded = function () { q.result.createObjectStore('keys'); };
    q.onerror = function () { reject(q.error); };
    q.onsuccess = function () {
      var db = q.result, tx = db.transaction('keys', mode === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('keys'), req = mode === 'get' ? st.get('k') : mode === 'put' ? st.put(val, 'k') : st.delete('k');
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    };
  });
};
M.signOut = function () { M.keyStore('del').catch(function () {}).then(function () { location.reload(); }); };

/* ------------------------------------------------------------ opening the core file and starting the dashboard */
M.setData = function (core) {
  var tb = M.D.tabs;
  Object.keys(core).forEach(function (k) { if (k !== 'tabs') M.D[k] = core[k]; });
  M.lazy.base = {};
  Object.keys(core.tabs).forEach(function (t) { tb[t] = core.tabs[t]; M.lazy.base[t] = core.tabs[t].r.slice(); });
  M.dropCaches();
};
M.openCore = function (enc, mac) {
  M.lazy.enc = enc; M.lazy.mac = mac;
  return M.lazyFetch('core').then(function (core) { M.setData(core); });
};
M.startHosted = function () {
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  try { M.init(); } catch (err) { console.error(err); document.getElementById('main').textContent = 'The dashboard could not start: ' + (err && err.message ? err.message : 'error'); }
  var rf = document.getElementById('rail-foot');      /* T847: Sign out sits at the bottom left of the sidebar */
  if (rf && !document.getElementById('signout')) rf.appendChild(M.h('button', { type: 'button', class: 'rf-signout', id: 'signout', title: 'Forget the password on this device', onclick: M.signOut }, [M.s('svg', { class: 'ic', 'aria-hidden': 'true' }, [M.s('use', { href: '#i-out' })]), M.h('span', { text: 'Sign out' })]));
};

M.unlock = function () {
  var lock = document.getElementById('lock'), form = document.getElementById('lock-form'), input = document.getElementById('lock-pass'), keep = document.getElementById('lock-keep'),
      msg = document.getElementById('lock-msg'), btn = document.getElementById('lock-go');
  var say = function (t, bad) { msg.textContent = t; msg.className = 'lock-msg' + (bad ? ' bad' : ''); };
  if (!MZ.ok) { lock.hidden = false; say('This browser cannot open the dashboard: it needs a secure (https) page and encryption support. Use a current Safari, Chrome or Firefox.', true); btn.disabled = true; return; }
  var enter = function (ks, remember) {
    return M.openCore(ks.enc, ks.mac).then(function () {
      if (remember) M.keyStore('put', { enc: ks.enc, mac: ks.mac }).catch(function () {});
      M.startHosted();
    });
  };
  /* a device that was kept signed in opens straight away; if the key has changed since, the kept keys open nothing and the passphrase is asked again */
  M.keyStore('get').then(function (k) {
    if (!k || !k.enc || !k.mac) return false;
    return enter(k, false).then(function () { return true; }, function () { return M.keyStore('del').catch(function () {}).then(function () { return false; }); });
  }).catch(function () { return false; }).then(function (ok) {
    if (ok) return;
    lock.hidden = false;
    input.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = input.value.trim().replace(/\s+/g, '-').toLowerCase();         /* spaces or dashes between the words both work */
      if (!pass) { say('Type the passphrase.', true); return; }
      btn.disabled = true; say('Checking... this takes a second on purpose.');
      var step = 'site';
      fetch('site.json', { credentials: 'omit', cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('site.json answered ' + r.status); return r.json(); })
        .then(function (site) { step = 'key'; return MZ.unwrap(site, pass); })
        .then(function (dek) { return MZ.deriveKeys(dek); })
        .then(function (ks) { step = 'data'; return enter(ks, keep.checked); })
        .catch(function (err) {
          btn.disabled = false;
          say(step === 'key' ? 'That passphrase did not open the dashboard. Check the words and the dashes, then try again.' : 'Could not load the data (' + (err && err.message ? err.message : 'error') + '). Check the connection and try again.', true);
          input.select();
        });
    });
  });
};

/* start the dashboard once every page has registered itself */
try { if (window.MAZO_HOSTED) M.unlock(); else M.init(); } catch (err) {
  console.error(err);
  var m = document.getElementById('main');
  if (m) m.textContent = 'The dashboard could not start: ' + (err && err.message ? err.message : 'error') + '. Rebuild it with scripts/dashboard_html.py.';
}
</script>
