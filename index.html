   Type scale 12 / 14 / 16 / 20 / 28 / 40 px. Spacing scale 4 / 8 / 12 / 16 / 24 / 32 / 48 px. Text never uses mustard or plain grey on the page (below 4.5:1); the -t variants are the text versions.
   The @font-face rules for Merriweather (headings, 400 only: the shop's heading weight) and Archivo (body, 400 to 700, with tabular figures) are put in front of this file by dashboard_html.py. */
:root{
  --maroon:#5E1204; --mustard:#C8892A; --cream:#F0EDE7; --paper:#FAF7F3; --card:#FFFFFF; --wash:#F4EFE9; --line:#E8E1D8; --field:#857E73;
  --green:#40805B; --terra:#B5532E; --teal:#3A7F8C; --grey:#7A7A7A; --grid:#E7E2DB;
  --ink:#2A2A2A; --ink2:#595959; --green-t:#2F6A47; --terra-t:#9A4220; --teal-t:#2C6672; --mustard-t:#7D5208;
  --serif:Merriweather,Georgia,"Times New Roman",serif; --sans:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-2xl:40px;
  --r-sm:8px; --r:12px; --r-lg:16px; --ease:cubic-bezier(.2,.7,.2,1); --rail:248px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px;scroll-behavior:smooth;scrollbar-color:#C9BDAE transparent;scrollbar-width:thin;accent-color:var(--maroon)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-sm)/1.55 var(--sans);font-variant-numeric:tabular-nums;font-synthesis:none;overflow-x:hidden;-webkit-font-smoothing:antialiased;caret-color:var(--maroon)}
::selection{background:#F1DDB8;color:#2A2A2A}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--maroon);margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:var(--fs-xl);letter-spacing:-.01em}
h3{font-size:var(--fs-md)}
p{margin:var(--s1) 0}
button,select,input{font:inherit;color:inherit}
a{color:var(--maroon)}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--maroon);color:#fff;padding:var(--s2) var(--s4);z-index:100}
.skip:focus{left:0}
.muted{color:var(--ink2)}
.small{font-size:var(--fs-xs)}
.nowrap{white-space:nowrap}
.ic{width:20px;height:20px;flex:0 0 20px;stroke:none}
.link{all:unset;cursor:pointer;color:var(--maroon);text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-sm);border-radius:4px;display:inline-flex;align-items:center;min-height:32px;padding:0 var(--s1)}
.link:hover{color:#8a2008}
.link:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}

/* shell: rail + stage */
#app{display:flex;min-height:100vh}
#rail{position:sticky;top:0;align-self:flex-start;flex:0 0 var(--rail);width:var(--rail);height:100vh;display:flex;flex-direction:column;background:var(--maroon);color:var(--cream);overflow-y:auto;scrollbar-color:#8a4a3a transparent;z-index:50}
.rail-top{padding:var(--s5) var(--s5) var(--s4);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2)}
.brand{display:flex;flex-direction:column;gap:var(--s2);text-decoration:none;color:var(--cream);border-radius:var(--r-sm)}
.wordmark{display:block;width:124px;height:auto;color:var(--cream)}
.brand-sub{font-size:var(--fs-xs);color:#E3D6CC;letter-spacing:.02em}
.rail-close{all:unset;display:none;cursor:pointer;color:var(--cream);width:36px;height:36px;border-radius:var(--r-sm);align-items:center;justify-content:center}
.rail-close .ic{stroke:currentColor}
#nav{padding:var(--s2) var(--s3) var(--s5);flex:1}
.ng{margin-top:var(--s5)}
.ngt{margin:0 var(--s3) var(--s2);font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#D9C5B8}
#nav ul{list-style:none;margin:0;padding:0}
#nav a{display:flex;align-items:center;min-height:40px;padding:var(--s2) var(--s3);border-radius:var(--r-sm);color:#F4EBE3;text-decoration:none;font-size:var(--fs-sm);transition:background .15s var(--ease)}
#nav a:hover{background:rgba(240,237,231,.1)}
#nav a[aria-current="page"]{background:rgba(240,237,231,.16);color:#fff;font-weight:600}
#nav a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mustard);margin-right:var(--s2);flex:0 0 6px}
#rail :focus-visible{outline-color:var(--cream)}
.rail-foot{margin:0;padding:var(--s4) var(--s5) var(--s5);font-size:var(--fs-xs);line-height:1.5;color:#E3D6CC;border-top:1px solid rgba(240,237,231,.16)}
#stage{flex:1;min-width:0}
#mobilebar{display:none}

/* toolbar: the only sticky thing */
#controls{position:sticky;top:0;z-index:30;background:rgba(250,247,243,.94);-webkit-backdrop-filter:saturate(1.2) blur(8px);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);padding:var(--s3) var(--s6)}
.toolrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.tpop{position:relative}
.tbtn{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s3);border:1px solid #D5CBBE;border-radius:var(--r-sm);background:#fff;color:var(--ink);cursor:pointer;font-size:var(--fs-sm);max-width:100%;transition:background .15s var(--ease),border-color .15s var(--ease)}
.tbtn:hover{background:var(--wash);border-color:#C4B8A9}
.tbtn[aria-expanded="true"]{border-color:var(--maroon);background:#fff}
.tbtn .ic{stroke:currentColor;color:var(--maroon)}
.tbtn .chev{width:16px;height:16px;flex-basis:16px;color:var(--ink2)}
.tbtn .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn.on{border-color:var(--maroon)}
.badge-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--maroon);color:#fff;font-size:var(--fs-xs);font-weight:600}
.menu-btn{display:none}
.sw{display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;cursor:pointer;user-select:none;position:relative;font-size:var(--fs-sm);color:var(--ink)}
.sw input{position:absolute;opacity:0;width:40px;height:24px;margin:0;left:0;cursor:pointer}
.swt{position:relative;width:40px;height:24px;border-radius:999px;background:#B9AFA2;flex:0 0 40px;transition:background .18s var(--ease)}
.swt::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s var(--ease)}
.sw input:checked + .swt{background:var(--maroon)}
.sw input:checked + .swt::after{transform:translateX(16px)}
.sw input:focus-visible + .swt{outline:2px solid var(--maroon);outline-offset:2px}
.sw input:disabled + .swt{opacity:.5}
.ctl-sum{display:none}
.popover{position:absolute;top:calc(100% + var(--s2));left:0;z-index:40;width:min(340px,92vw);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 6px rgba(42,42,42,.06),0 16px 40px rgba(42,42,42,.14);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.popover[hidden]{display:none}
.pop-right{left:auto;right:0;width:min(400px,92vw)}
.popover .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.pop-foot{display:flex;justify-content:flex-end;padding-top:var(--s1)}
.range-line{margin:0;font-size:var(--fs-xs);color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.fld label{font-size:var(--fs-xs);color:var(--ink2);font-weight:500}
.fld select,.fld input[type=date]{height:40px;border:1px solid var(--field);border-radius:var(--r-sm);background:#fff;padding:0 var(--s2);max-width:100%;min-width:0;width:100%;font-size:var(--fs-sm)}
.fld.ignored,.sw.ignored,.tpop.ignored{display:none}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chips[hidden]{display:none}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--s2);min-height:32px;padding:0 var(--s3);border-radius:999px;background:#fff;border:1px solid #CDBFAE;font-size:var(--fs-xs);color:var(--ink);cursor:pointer}
.chip:hover{background:var(--wash)}
.chip:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.chip .ic{width:14px;height:14px;flex-basis:14px;stroke:currentColor;color:var(--maroon)}
.chip-k{color:var(--ink2)}
.chip.off{cursor:default;border-style:dashed;color:var(--ink2);padding:0 var(--s3)}
.chip.off:hover{background:#fff}
.btn{height:40px;border:1px solid var(--maroon);background:#fff;color:var(--maroon);border-radius:var(--r-sm);padding:0 var(--s4);cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:var(--wash)}
.btn.on{background:var(--maroon);color:#fff}

/* page */
main{max-width:1240px;padding:var(--s6) var(--s6) var(--s7);outline:none}
.boot{color:var(--ink2);padding:var(--s6) 0}
.pg-head{margin:0 0 var(--s5)}
.pg-line{display:flex;align-items:center;gap:var(--s2)}
.pg-q{margin:var(--s1) 0 0;font-size:var(--fs-md);color:var(--ink2);max-width:72ch;line-height:1.5}
.info{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink2)}
.info .ic{stroke:currentColor}
.info:hover{background:var(--wash);color:var(--maroon)}
.info[aria-expanded="true"]{background:var(--wash);color:var(--maroon)}
.info:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.quiet{margin:calc(var(--s2) * -1) 0 var(--s4);padding:var(--s2) var(--s3);background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--ink2);max-width:72ch}
.quiet a{color:var(--maroon);text-underline-offset:3px}
.pg-more{margin-top:var(--s3);padding:var(--s3) var(--s4);background:#fff;border:1px solid var(--line);border-radius:var(--r);max-width:72ch}
.pg-more[hidden]{display:none}
.pg-more p{margin:var(--s1) 0;font-size:var(--fs-sm)}
.note{background:#FBF3E2;border:1px solid #EBD9AE;padding:var(--s3) var(--s4);border-radius:var(--r);font-size:var(--fs-sm);margin:var(--s3) 0;color:#4A3A12}
.note.warn{background:#FAECE5;border-color:#E9C6B7;color:#5B2410}
.grid{display:grid;gap:var(--s5);grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin:var(--s5) 0}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr))}
.grid.one{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);min-width:0}
.card>h3{margin-bottom:var(--s1)}
.card .why{color:var(--ink2);font-size:var(--fs-sm);margin:0 0 var(--s4);max-width:80ch}
.card .why.long{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .why.long.open{display:block}
.more{all:unset;cursor:pointer;color:var(--maroon);text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-xs);margin:calc(var(--s2) * -1) 0 var(--s3);display:inline-block;min-height:24px;line-height:24px}
.more:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}

/* number tiles: label, big figure, small change chip */
.kpis{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin:var(--s4) 0 var(--s5)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);min-width:0;container-type:inline-size;display:flex;flex-direction:column;gap:var(--s1)}
.kpi .l{font-size:var(--fs-sm);color:var(--ink2)}
.kpi .v{line-height:1.15;color:var(--maroon);font-weight:600;letter-spacing:-.01em;white-space:nowrap;font-size:clamp(20px,13cqw,28px)}
.kpi .d{font-size:var(--fs-xs);color:var(--ink2);min-height:1.5em}
.kpi .chip-d{align-self:flex-start;padding:2px var(--s2);border-radius:999px;font-weight:600}
.kpi .chip-d.up{color:var(--green-t);background:#EAF3EE}
.kpi .chip-d.down{color:var(--terra-t);background:#F8E9E2}
.kpi .chip-d.flat{color:var(--ink2);background:#F2EFEA}
.kpi svg{display:block;width:100%;height:32px;margin-top:var(--s2)}
.kpi svg polyline{stroke-width:1.5}
.kpi.na .v{color:var(--ink2);font-size:var(--fs-md);white-space:normal;font-weight:500}
.kpi.hero{padding:var(--s5) var(--s6)}
.kpi.hero .l{font-size:var(--fs-md);color:var(--ink)}
.kpi.hero .v{font-size:clamp(28px,15cqw,40px)}
.kpi.hero svg{height:64px}
.kpis.lead{grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr))}
.kpis.rates{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:calc(var(--s2) * -1)}
.kpis.rates .kpi{padding:var(--s3) var(--s5)}
.kpis.rates .v{font-size:clamp(18px,10cqw,20px)}
.kpis.rates svg{height:24px}

/* charts */
.cb{width:100%;min-height:40px}
.cb svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);fill:var(--ink2);font-size:11px}
svg .ax{stroke:var(--grid);stroke-width:1}
svg .gl{stroke:var(--grid);stroke-width:1;stroke-dasharray:none}
svg .strong{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--fs-xs);margin:var(--s2) 0;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.hit{cursor:crosshair}
.dot:focus-visible,.mk:focus-visible{outline:2px solid var(--maroon);outline-offset:1px}
.empty{padding:var(--s5);text-align:center;color:var(--ink2);background:var(--wash);border:1px dashed #D5CBBE;border-radius:var(--r);font-size:var(--fs-sm)}
.empty .hint{display:block;margin-top:var(--s1);font-size:var(--fs-xs);color:var(--ink2)}
.tag{display:inline-block;font-size:var(--fs-xs);padding:1px var(--s2);border-radius:999px;background:var(--wash);border:1px solid #CFC8BE;color:var(--ink);white-space:nowrap}
.tag.thin{background:#FBF1DC;border-color:#E3C98F;color:#5E4308}
.tag.indic{background:#EDF3F5;border-color:#B6CBD1;color:#24505B}

tr.rowdetail:hover td,tr.click:hover td{background:var(--wash)}

.tbl-more{padding:var(--s3);margin:0;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;border-top:1px solid var(--line)}
button.dimlink{all:unset;box-sizing:border-box;cursor:pointer;color:var(--ink);border-bottom:1px dotted #8f8579;border-radius:2px;max-width:100%;overflow-wrap:anywhere}
button.dimlink:hover{color:var(--maroon);border-bottom-color:var(--maroon);border-bottom-style:solid}
button.dimlink:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
@media (pointer:coarse){button.dimlink{padding:10px 0;display:inline-block}}
.hb.dimlink{cursor:pointer;border-radius:var(--r-sm)}
.hb.dimlink:hover{background:var(--wash)}
.hb.dimlink:hover .lb{color:var(--maroon);text-decoration:underline;text-underline-offset:3px}
.has-tip{cursor:pointer}
g.has-tip:hover circle:nth-child(2){stroke:var(--maroon)}
td.c.has-tip:hover{outline:2px solid var(--maroon);outline-offset:-2px}

/* folds: secondary detail behind a clear control. A plain divider row, no box, so what is inside keeps the full width of the page */
.fold{margin:var(--s5) 0 var(--s2);border-top:1px solid var(--line)}
.fold>summary{cursor:pointer;min-height:52px;display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;align-content:center;padding:var(--s3) 0;list-style:none;color:var(--maroon);font-size:var(--fs-md);font-family:var(--serif);position:relative;padding-right:var(--s6)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";position:absolute;right:var(--s2);top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--maroon);border-bottom:2px solid var(--maroon);transform:rotate(45deg);transition:transform .15s var(--ease)}
.fold[open]>summary::after{transform:rotate(-135deg);margin-top:-2px}
.fold>summary:hover{color:#8a2008}
.fold>summary:focus-visible{outline:2px solid var(--maroon);outline-offset:2px;border-radius:var(--r-sm)}
.fold-hint{font:400 var(--fs-xs)/1.4 var(--sans);color:var(--ink2)}
.fold>.grid,.fold>.card{margin-top:var(--s2)}

/* the detail panel */
.detail{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(42,42,42,.16);z-index:90;padding:var(--s5);overflow:auto;display:flex;flex-direction:column;gap:var(--s3)}
.detail[hidden]{display:none}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.detail-head h2{font-size:var(--fs-lg);overflow-wrap:anywhere}
.detail-list{margin:0;display:flex;flex-direction:column}
.detail-row{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s2) 0;border-bottom:1px solid #F0EAE2;font-size:var(--fs-sm)}
.detail-row dt{color:var(--ink2);flex:0 0 42%}
.detail-row dd{margin:0;text-align:right;color:var(--ink);overflow-wrap:anywhere;min-width:0}
.detail-acts{display:flex;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s2)}
@media (max-width:640px){.detail{top:auto;height:auto;max-height:80vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -12px 40px rgba(42,42,42,.22)}}

/* full screen controls strip */
.fs-ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s3) var(--s4);padding:var(--s3) var(--s4);background:var(--wash);border-radius:var(--r)}
.fs-ctl .fld{min-width:120px;flex:0 1 170px}
.fs-ctl .fld select,.fs-ctl .fld input[type=date]{height:40px;border:1px solid var(--field);border-radius:var(--r-sm);background:#fff;padding:0 var(--s2);width:100%;font-size:var(--fs-sm)}
.card.fs .tblbox{margin-top:var(--s2)}
.card.fs .tw.tall{max-height:none}
@media (max-width:640px){.fs-ctl .fld{flex:1 1 44%}}
body.detail-on #fsroot .card.fs{padding-right:var(--s6)}
.card.fs .tblbox .tbl-q{display:inline-block!important}
.card.fs .tblbox .tbl-tools .tbl-n{display:inline!important}

@media (max-width:640px){
  .tbl-q{height:44px;flex:1 1 100%}
  .tbl-csv{margin-left:0}
  .gs-in{height:44px;font-size:16px}
  .gs-ic{top:12px}
  .subnav a{min-height:44px}
  .sr-i{min-height:48px}
  .tbtn{height:44px}
  .ibtn{width:40px;height:40px}
  .fs-ctl .fld select,.fs-ctl .fld input[type=date]{height:44px;font-size:16px}
}
@media (pointer:coarse){.tbl-q{height:44px}.btn.sm{height:40px}}

/* mazo dashboard, hosted mode (T807, 1 Nov 2026): the unlock screen and the loader that fetches data by month. Only runs when the page was built for the web (window.MAZO_HOSTED);
   the one file build (docs/reports/dashboard/mazo-dashboard.html) never uses any of this. Plan and design: docs/guides/robust-data-and-hosting-plan.md, scripts/site_crypto.py.

   How data reaches a page: the small "core" file (state tables, totals, the table list, the filter lists, which month files exist) is opened once after the passphrase. Before every
   draw, M.needFor() works out which month files the page needs (the chosen dates, the period before them for compare, the last two months, and the night pictures a page asks for),
   M.ensure() fetches and opens only the missing ones, merges their rows into the tables, and then the normal synchronous draw runs. Nothing else in the dashboard knows about this. */

M.lazy = { enc: null, mac: null, done: {}, inflight: {}, parts: {}, base: {}, token: 0 };

/* ------------------------------------------------------------ fetching and merging */
M.lazyFetch = function (logical) {
  return MZ.nameOf(M.lazy.mac, logical).then(function (name) {
    return fetch('f/' + name, { credentials: 'omit', cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(logical + ' answered ' + r.status);

M.lazyMerge = function (logical, obj) {

  Object.keys(obj.t || {}).forEach(function (t) {
    if (!tabs[t]) tabs[t] = { c: [], r: [] };
    var p = L.parts[t] || (L.parts[t] = { months: {} });
    p.months[logical] = obj.t[t];
    var rows = (L.base[t] || []).slice();
    Object.keys(p.months).sort().forEach(function (k) { rows = rows.concat(p.months[k]); });

/* ------------------------------------------------------------ opening the core file and starting the dashboard */
M.setData = function (core) {
  var tb = M.D.tabs;
  Object.keys(core).forEach(function (k) { if (k !== 'tabs') M.D[k] = core[k]; });
  M.lazy.base = {};
  Object.keys(core.tabs).forEach(function (t) { tb[t] = core.tabs[t]; M.lazy.base[t] = core.tabs[t].r.slice(); });
  M.dropCaches();
};
M.openCore = function (enc, mac) {
  M.lazy.enc = enc; M.lazy.mac = mac;
  return M.lazyFetch('core').then(function (core) { M.setData(core); });
};
M.startHosted = function () {
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  try { M.init(); } catch (err) { console.error(err); document.getElementById('main').textContent = 'The dashboard could not start: ' + (err && err.message ? err.message : 'error'); }
  var f = document.getElementById('foot');
  if (f && !document.getElementById('signout')) f.parentNode.appendChild(M.h('p', { class: 'small signout', id: 'signout' }, [M.h('button', { type: 'button', class: 'link', text: 'Sign out of this device', onclick: M.signOut })]));
};

M.unlock = function () {
  var lock = document.getElementById('lock'), form = document.getElementById('lock-form'), input = document.getElementById('lock-pass'), keep = document.getElementById('lock-keep'),
      msg = document.getElementById('lock-msg'), btn = document.getElementById('lock-go');
  var say = function (t, bad) { msg.textContent = t; msg.className = 'lock-msg' + (bad ? ' bad' : ''); };
  if (!MZ.ok) { lock.hidden = false; say('This browser cannot open the dashboard: it needs a secure (https) page and encryption support. Use a current Safari, Chrome or Firefox.', true); btn.disabled = true; return; }
  var enter = function (ks, remember) {
    return M.openCore(ks.enc, ks.mac).then(function () {
      if (remember) M.keyStore('put', { enc: ks.enc, mac: ks.mac }).catch(function () {});
      M.startHosted();
    });
  };
  /* a device that was kept signed in opens straight away; if the key has changed since, the kept keys open nothing and the passphrase is asked again */
  M.keyStore('get').then(function (k) {
    if (!k || !k.enc || !k.mac) return false;
    return enter(k, false).then(function () { return true; }, function () { return M.keyStore('del').catch(function () {}).then(function () { return false; }); });
  }).catch(function () { return false; }).then(function (ok) {
    if (ok) return;
    lock.hidden = false;
    input.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = input.value.trim().replace(/\s+/g, '-').toLowerCase();         /* spaces or dashes between the words both work */
      if (!pass) { say('Type the passphrase.', true); return; }
      btn.disabled = true; say('Checking... this takes a second on purpose.');
      var step = 'site';
      fetch('site.json', { credentials: 'omit', cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('site.json answered ' + r.status); return r.json(); })
        .then(function (site) { step = 'key'; return MZ.unwrap(site, pass); })
        .then(function (dek) { return MZ.deriveKeys(dek); })
        .then(function (ks) { step = 'data'; return enter(ks, keep.checked); })
        .catch(function (err) {
          btn.disabled = false;
          say(step === 'key' ? 'That passphrase did not open the dashboard. Check the words and the dashes, then try again.' : 'Could not load the data (' + (err && err.message ? err.message : 'error') + '). Check the connection and try again.', true);
          input.select();
        });
    });
  });
};

/* start the dashboard once every page has registered itself */
try { if (window.MAZO_HOSTED) M.unlock(); else M.init(); } catch (err) {
  console.error(err);
  var m = document.getElementById('main');
  if (m) m.textContent = 'The dashboard could not start: ' + (err && err.message ? err.message : 'error') + '. Rebuild it with scripts/dashboard_html.py.';
}
</script>
</body>
